name: Native Package Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: recursive-windows.exe
            glob: recursive-packaging/target/dist/*/*.exe
          - os: ubuntu-latest
            artifact: recursive-linux.deb
            glob: recursive-packaging/target/dist/*/*.deb
          - os: macos-latest
            artifact: recursive-macos.dmg
            glob: recursive-packaging/target/dist/*/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build application
        run: mvn -B -DskipTests -Dskip.jpackage=false package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

      - name: Attach installer to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.glob }}
